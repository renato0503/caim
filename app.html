<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CAIM">
  <meta name="description" content="Mobile-first AI coding agent interface">
  <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="mask-icon" href="/assets/icons/logo_caim.png" color="#2dd4bf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CAIM">
  <meta name="apple-mobile-web-app-orientation" content="portrait">
  <title>CAIM — IDE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonte pixel (Press Start 2P) carregada de forma assíncrona via app.js
       para tirá-la do caminho crítico de render (LCP/FCP). -->
  <link rel="preload" as="image" href="/assets/icons/icon-192.png" fetchpriority="high">
  <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" href="/assets/splash/splash-640x1136.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="/assets/splash/splash-750x1334.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)" href="/assets/splash/splash-1242x2208.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="/assets/splash/splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="/assets/splash/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" href="/assets/splash/splash-1242x2688.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/assets/splash/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="/assets/splash/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/assets/splash/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/assets/splash/splash-1290x2796.png">
</head>
<body>
  <div id="app">
    <!-- ==================== AUTH SCREEN ==================== -->
    <div id="screen-auth" class="screen active">
      <div class="auth-shell">
        <img class="auth-logo" src="/assets/icons/icon-192.png" alt="CAIM">
        <h1 class="auth-title">CAIM</h1>
        <p class="auth-subtitle">MVP Factory — gere e publique MVPs no GitHub Pages</p>

        <div class="auth-tabs">
          <button id="auth-tab-login" class="auth-tab active">Entrar</button>
          <button id="auth-tab-signup" class="auth-tab">Criar conta</button>
        </div>

        <div class="auth-form">
          <input id="auth-name" type="text" placeholder="Nome completo" autocomplete="name" aria-label="Nome completo" class="hidden">
          <input id="auth-whatsapp" type="tel" placeholder="WhatsApp (opcional)" autocomplete="tel" aria-label="WhatsApp" class="hidden">
          <input id="auth-email" type="email" placeholder="Email" autocomplete="email" aria-label="Email">
          <input id="auth-password" type="password" placeholder="Senha" autocomplete="current-password" aria-label="Senha">
          <button id="auth-forgot" class="auth-link hidden" type="button">Esqueci minha senha</button>
          <div id="auth-error" class="auth-error"></div>
          <button id="auth-submit" class="auth-submit">Entrar</button>
        </div>

        <div id="auth-config-note" class="auth-note hidden"></div>
        <button id="auth-dev-btn" class="auth-dev hidden">Entrar em modo dev (teste)</button>
      </div>
    </div>

    <!-- ==================== DASHBOARD SCREEN ==================== -->
    <div id="screen-dashboard" class="screen">
      <div class="dash-shell">
        <div class="dash-head">
<img class="auth-logo" src="/assets/icons/icon-192.png" alt="CAIM" fetchpriority="high">
          <h1 id="dashboard-user-name" class="dash-title">Bem-vindo(a)</h1>
        </div>
        <p class="dash-subtitle">Seus MVPs publicados</p>
        <div id="dashboard-verify" class="auth-note hidden">
          <span>Email não verificado.</span>
          <button id="dashboard-verify-btn" class="auth-link" type="button">Reenviar link</button>
        </div>
        <div id="dashboard-projects" class="dash-projects"></div>
        <div class="dash-actions">
          <button id="dashboard-open-ide" class="dash-btn dash-primary">Abrir IDE</button>
          <button id="dashboard-settings-btn" class="dash-btn">Configurar APIs</button>
          <button id="dashboard-logout" class="dash-btn">Sair</button>
        </div>
      </div>
    </div>

    <!-- ==================== SETTINGS SCREEN ==================== -->
    <div id="screen-settings" class="screen">
      <div class="settings-shell">
        <div class="subscreen-header">
          <button id="settings-back" class="dash-btn dash-icon-btn" aria-label="Voltar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <h1 class="dash-title">APIs de LLM</h1>
          <span class="subscreen-spacer"></span>
        </div>
        <p class="dash-subtitle">Até 3 chaves com failover (prioridade 1 → 2 → 3). As chaves são cifradas.</p>
        <div id="settings-list" class="settings-list"></div>
        <div class="dash-actions">
          <button id="settings-save" class="dash-btn dash-primary">Salvar</button>
          <button id="settings-logout" class="dash-btn dash-danger">Sair</button>
        </div>
      </div>
    </div>

    <!-- ==================== IDE SCREEN (S4.5) ==================== -->
    <div id="screen-ide" class="screen">

    <!-- ==================== HEADER (fixo) ==================== -->
    <header class="ide-header">
      <div class="ide-header-left">
        <button class="ide-icon-btn" id="menu-btn" aria-label="Explorer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <img class="ide-logo" src="/assets/icons/icon-32.png" alt="CAIM">
        <span class="ide-title">CAIM</span>
      </div>
      <div class="ide-header-actions">
        <button class="ide-icon-btn" id="ide-back-btn" data-nav-back aria-label="Voltar ao dashboard" title="Voltar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="ide-deploy-btn" id="deploy-btn" aria-label="Publicar MVP">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 2 11 13"></polyline><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          <span>Deploy</span>
        </button>
        <button class="ide-icon-btn" id="newfile-btn" aria-label="Novo arquivo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button class="ide-icon-btn" id="settings-btn" aria-label="Configurações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>

    <!-- ==================== WORKSPACE ==================== -->
    <div class="ide-workspace">
      <!-- Activity Bar -->
      <nav class="activity-bar" id="activity-bar">
        <button class="ab-item ab-active" data-activity="chat" aria-label="Chat" title="Chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </button>
        <button class="ab-item" data-activity="explorer" aria-label="Explorer" title="Explorer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        </button>
        <button class="ab-item" data-activity="settings" aria-label="Configurações" title="Configurações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </nav>

      <!-- Main: editor tabs + editor + statusbar -->
      <div class="ide-main">
        <div class="editor-tabs" id="editor-tabs"></div>
        <div class="editor-container" id="editor-container"></div>
        <div class="editor-statusbar"><span id="editor-status">Nenhum arquivo aberto</span></div>
      </div>
    </div>

    <!-- ==================== BOTTOM SHEET ==================== -->
    <div class="bottom-sheet" id="bottom-sheet">
      <div class="bs-handle" id="bs-handle" aria-hidden="true"></div>
      <div class="bs-tabs">
        <button class="bs-tab bs-active" data-pane="chat">Chat</button>
        <button class="bs-tab" data-pane="diff">Diff</button>
        <button class="bs-tab" data-pane="preview">Preview</button>
        <button class="bs-tab" data-pane="git">Git</button>
      </div>
      <div class="bs-panes">
        <section class="bs-pane bs-pane-chat active" data-pane="chat">
          <header class="pane-header chat-options">
            <span class="pane-title">Chat</span>
            <div class="chat-options-right">
              <label class="think-toggle" title="Mostrar o raciocínio do modelo">
                <input type="checkbox" id="think-toggle">
                <span>Pensar</span>
              </label>
              <button class="chat-stop hidden" id="chat-stop" aria-label="Parar geração">
                <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
              </button>
            </div>
          </header>
          <div class="messages caim-messages" id="chat-messages"></div>
          <div class="caim-input-area">
            <div class="caim-input-wrap">
              <textarea class="caim-input" id="chat-input" rows="1" placeholder="Peça uma alteração no código..." autocomplete="off" enterkeyhint="send"></textarea>
            </div>
            <button class="caim-send" id="send-btn" aria-label="Enviar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </section>
        <section class="bs-pane bs-pane-diff" data-pane="diff">
          <div class="pane-header">
            <span class="pane-title">Diff</span>
          </div>
          <div class="diff-viewer-container" id="diff-container"></div>
        </section>
        <section class="bs-pane bs-pane-preview" data-pane="preview">
          <header class="pane-header">
            <span class="pane-title" id="viewer-title">Visualizador</span>
            <button class="ide-btn" id="viewer-open-editor">Abrir no editor</button>
          </header>
          <div class="viewer-content" id="viewer-content"></div>
        </section>
        <section class="bs-pane bs-pane-git" data-pane="git">
          <div class="pane-header">
            <span class="pane-title">Git</span>
          </div>
          <div class="git-panel-container" id="git-panel"></div>
        </section>
      </div>
    </div>

    <!-- ==================== EXPLORER DRAWER ==================== -->
    <aside class="explorer-drawer" id="explorer-drawer" aria-label="Explorer">
      <header class="pane-header drawer-header">
        <span class="pane-title">Explorer</span>
        <div class="drawer-actions">
          <button class="ide-icon-btn" id="upload-btn" aria-label="Upload de arquivos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          </button>
          <button class="ide-icon-btn" id="close-drawer-btn" aria-label="Fechar explorer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </header>
      <div class="file-tree-container" id="file-tree"></div>
    </aside>
    <div class="drawer-backdrop" id="drawer-backdrop"></div>

    </div><!-- /screen-ide -->
  </div>
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
