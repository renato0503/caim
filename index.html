<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CAIM">
  <meta name="description" content="Mobile-first AI coding agent interface">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/assets/icons/icon-192.png">
  <title>CAIM</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    .app-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .main-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .panel {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .panel.active {
      display: flex;
    }
    .bottom-nav {
      display: flex;
      background: #1e293b;
      border-top: 1px solid #334155;
      flex-shrink: 0;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      color: #94a3b8;
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      transition: color 0.2s ease;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .nav-item.active {
      color: #38bdf8;
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      margin-bottom: 2px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-input-area {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: #1e293b;
      border-top: 1px solid #334155;
    }
    .chat-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-size: 15px;
      outline: none;
      min-height: 44px;
    }
    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #38bdf8;
      border: none;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-btn:active {
      opacity: 0.8;
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-title">CAIM</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <select id="model-select" style="background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:6px 8px;font-size:13px;">
          <option value="deepseek">DeepSeek Coder</option>
          <option value="qwen">Qwen</option>
        </select>
      </div>
    </header>
    <main class="main-content">
      <section id="panel-chat" class="panel active">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
          <input type="text" class="chat-input" id="chat-input" placeholder="Ask anything..." autocomplete="off">
          <button class="send-btn" id="send-btn" aria-label="Send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </section>
      <section id="panel-editor" class="panel">
        <div style="padding:12px 16px;color:#94a3b8;text-align:center;font-size:14px;">Editor initializes in Step 3</div>
      </section>
      <section id="panel-files" class="panel">
        <div style="padding:12px 16px;color:#94a3b8;text-align:center;font-size:14px;">File Tree initializes in Step 2</div>
      </section>
    </main>
    <nav class="bottom-nav">
      <a class="nav-item active" data-panel="panel-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>Chat</span>
      </a>
      <a class="nav-item" data-panel="panel-editor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        <span>Editor</span>
      </a>
      <a class="nav-item" data-panel="panel-files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        <span>Files</span>
      </a>
    </nav>
  </div>
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
